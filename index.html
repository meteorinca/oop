<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Order of Operations Example</title>
  <style>
    :root{
      --bg:#eef2f5;
      --text:#111;
      --muted:#2a2a2a;
      --red:#d23a2e;
      --box:#ffffff;
      --line:#111;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Page */
    .page{
      width:min(1200px, 96vw);
      margin: 28px auto 40px;
      position:relative;
      padding: 10px 10px 40px;
    }

    /* Subtle "numbers" texture (optional, close enough) */
    .page::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 10% 20%, rgba(0,0,0,.035) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 40%, rgba(0,0,0,.03) 0 1px, transparent 2px),
        radial-gradient(circle at 30% 80%, rgba(0,0,0,.03) 0 1px, transparent 2px);
      opacity:.55;
      pointer-events:none;
    }

    .grid{
      position:relative;
      display:grid;
      grid-template-columns: 1fr 620px 260px;
      gap: 20px;
      align-items:start;
      z-index:1;
    }

    /* Left title */
    .title-row{
      grid-column: 1 / 3;
      display:flex;
      align-items:baseline;
      gap: 18px;
      padding-top: 4px;
    }
    .title-row .example{
      font-weight:900;
      font-size: 64px;
      letter-spacing:.2px;
    }
    .title-row .expr{
      font-weight:900;
      font-size: 64px;
      letter-spacing:.2px;
      white-space:nowrap;
    }
    .sup{
      font-size:.55em;
      vertical-align: super;
      margin-left: 2px;
    }

    /* Middle stack */
    .stack{
      grid-column: 2;
      margin-top: 6px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 18px;
    }

    .line{
      width: 620px;
      font-weight: 900;
      font-size: 70px;
      letter-spacing:.2px;
      text-align:left;
      position:relative;
    }

    /* Highlight bracket over (7-5) */
    .bracket-wrap{
      display:inline-block;
      position:relative;
      padding-bottom: 12px; /* space for bracket */
    }
    .bracket-wrap .bracket{
      position:absolute;
      left: -6px;
      right: -6px;
      bottom: 0px;
      height: 18px;
      border: 4px solid var(--line);
      border-top: none;
      border-radius: 0 0 6px 6px;
    }
    .down{
      width: 0;
      height: 0;
      margin: -6px 0 0;
      position:relative;
    }
    /* Arrow stem */
    .down::before{
      content:"";
      position:absolute;
      left: -2px;
      top: 0;
      width: 4px;
      height: 40px;
      background: var(--line);
    }
    /* Arrow head */
    .down::after{
      content:"";
      position:absolute;
      left: -10px;
      top: 36px;
      width: 0; height: 0;
      border-left: 10px solid transparent;
      border-right:10px solid transparent;
      border-top: 14px solid var(--line);
    }

    .red{ color: var(--red); }

    /* Underline group on same line (like 12 + 48 + 1) */
    .under{
      display:inline-block;
      position:relative;
      padding-bottom: 16px;
      margin-top: 4px;
    }
    .under::after{
      content:"";
      position:absolute;
      left: -6px;
      right: -6px;
      bottom: 4px;
      height: 5px;
      background: var(--line);
      border-radius: 3px;
    }

    /* "Answer" area */
    .answer{
      margin-top: 6px;
      text-align:center;
    }
    .answer .n{
      font-weight: 900;
      font-size: 88px;
      line-height: 1;
    }
    .answer .bar{
      width: 220px;
      height: 6px;
      background: var(--line);
      margin: 10px auto 6px;
      border-radius: 3px;
    }
    .answer .label{
      font-weight: 900;
      font-size: 34px;
    }

    /* Right instruction boxes */
    .right{
      grid-column: 3;
      margin-top: 110px; /* aligns beside the steps like screenshot */
      display:flex;
      flex-direction:column;
      gap: 28px;
    }
    .box{
      background: var(--box);
      border: 3px solid var(--line);
      padding: 10px 14px;
      font-weight: 800;
      font-size: 22px;
      width: 100%;
      text-align:center;
      box-shadow: 0 1px 0 rgba(0,0,0,.06);
    }

    /* Smaller bracket under "2^3 x 6" */
    .mini-bracket{
      display:inline-block;
      position:relative;
      padding-bottom: 10px;
    }
    .mini-bracket::after{
      content:"";
      position:absolute;
      left: -10px;
      right: -10px;
      bottom: 2px;
      height: 16px;
      border: 4px solid var(--line);
      border-top:none;
      border-radius: 0 0 6px 6px;
    }

    /* Small screens */
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
      .title-row{ grid-column: 1; flex-wrap:wrap; }
      .stack{ grid-column: 1; align-items:flex-start; }
      .line{ width: 100%; font-size: 54px; }
      .title-row .example, .title-row .expr{ font-size: 48px; }
      .right{ margin-top: 10px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="grid">
      <!-- Title -->
      <div class="title-row">
        <div class="example">Example:</div>
        <div class="expr">
          12 + (<span class="bracket-wrap">7 - 5<span class="bracket"></span></span>)<span class="sup">3</span> × 6 + 1 = ?
        </div>
      </div>

      <!-- Middle step-by-step -->
      <div class="stack">
        <!-- arrow from (7-5) to 2^3 -->
        <div class="down" style="transform: translateX(-130px);"></div>

        <div class="line">
          12 + <span class="red">2</span><span class="sup red">3</span> × 6 + 1
          <!-- small bracket under 2^3 -->
          <span class="mini-bracket" style="position:absolute; left: 178px; top: 78px;"></span>
        </div>

        <div class="down" style="transform: translateX(-20px);"></div>

        <div class="line">
          12 + <span class="red">8</span> × 6 + 1
          <!-- bracket under 8 x 6 -->
          <span style="position:absolute; left: 220px; top: 78px;" class="mini-bracket"></span>
        </div>

        <div class="down" style="transform: translateX(40px);"></div>

        <div class="line">
          <span class="under">12 + <span class="red">48</span> + 1</span>
        </div>

        <div class="down" style="transform: translateX(0px);"></div>

        <div class="answer">
          <div class="n">61</div>
          <div class="bar"></div>
          <div class="label">Answer</div>
        </div>
      </div>

      <!-- Right boxes -->
      <div class="right">
        <div class="box">Parentheses first</div>
        <div class="box">Then Exponents</div>
        <div class="box">Then Multiply</div>
        <div class="box">Then Add</div>
      </div>
    </div>
  </div>
</body>
</html>
