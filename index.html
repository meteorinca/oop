<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order of Ops Trainer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #333; overflow-x: hidden;
    }
    .container { text-align: center; max-width: 500px; padding: 20px; }
    h1 { font-size: 2.5em; color: white; margin-bottom: 10px; font-weight: 300; }
    .mode-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
    .mode-btn {
      padding: 12px 24px; border: none; border-radius: 50px; background: rgba(255,255,255,0.2);
      color: white; font-size: 1.1em; cursor: pointer; transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    .mode-btn.active { background: white; color: #667eea; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .problem { 
      font-size: 4em; font-weight: 200; color: white; margin: 40px 0; 
      min-height: 120px; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.1); border-radius: 20px; backdrop-filter: blur(20px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .step { opacity: 0; transform: translateY(20px); transition: all 0.6s ease; }
    .step.active { opacity: 1; transform: translateY(0); }
    .controls { display: flex; gap: 15px; justify-content: center; margin: 30px 0; }
    button { padding: 12px 30px; border: none; border-radius: 50px; background: white; color: #667eea; font-size: 1em; cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .answer-input { font-size: 2em; padding: 15px 20px; border: none; border-radius: 15px; width: 120px; text-align: center; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: all 0.3s; }
    .answer-input:focus { outline: none; box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
    .feedback { font-size: 1.5em; margin: 20px 0; min-height: 50px; }
    .correct { color: #4ade80; animation: bounce 0.5s; }
    .wrong { color: #f87171; animation: shake 0.5s; }
    @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-5px); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .menu {
      position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.95); padding: 20px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); backdrop-filter: blur(20px); max-width: 300px; display: none;
    }
    .menu.show { display: block; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    .menu h3 { margin-bottom: 10px; color: #667eea; }
    .menu ul { text-align: left; list-style: none; }
    .menu li { margin: 8px 0; padding: 5px; background: #f0f9ff; border-radius: 8px; }
    .menu-toggle { position: absolute; top: 20px; left: 20px; background: none; border: none; font-size: 1.5em; color: white; cursor: pointer; }
    .score { position: absolute; bottom: 20px; left: 20px; color: white; font-size: 1.2em; }
  </style>
</head>
<body>
  <div class="container">
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <h1>Order of Ops</h1>
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="basic">Basic</button>
      <button class="mode-btn" data-mode="advanced">Advanced</button>
    </div>
    <div class="problem" id="problem"></div>
    <div class="controls">
      <button onclick="nextProblem()">New</button>
      <button onclick="stepForward()" id="stepBtn">Step</button>
      <input type="number" class="answer-input" id="answerInput" placeholder="?" disabled>
      <button onclick="checkAnswer()">Check</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="score" id="score">Score: 0</div>
  </div>

  <div class="menu" id="menu">
    <h3>PEMDAS / BODMAS</h3>
    <ul id="rules">
      <li><strong>P/B:</strong> Parentheses / Brackets first</li>
      <li><strong>E/O:</strong> Exponents / Orders (powers, roots)</li>
      <li><strong>MD:</strong> Multiplication & Division (left to right)</li>
      <li><strong>AS:</strong> Addition & Subtraction (left to right)</li>
    </ul>
    <h3>Hints</h3>
    <ul id="hints"></ul>
  </div>

  <script>
    let currentMode = 'basic';
    let currentProblem = [];
    let currentSteps = [];
    let stepIndex = 0;
    let score = 0;
    let correctAnswer = 0;

    const ops = {
      basic: ['+', '-', '×', '÷'],
      advanced: ['+', '-', '×', '÷', '^', '√']
    };

    const generateProblem = () => {
      const mode = currentMode;
      let expr = [];
      const numTerms = mode === 'basic' ? 3 + Math.floor(Math.random() * 3) : 4 + Math.floor(Math.random() * 3);
      
      // Generate numbers and ops
      for (let i = 0; i < numTerms; i++) {
        if (i > 0) expr.push(ops[mode][Math.floor(Math.random() * ops[mode].length)]);
        expr.push(Math.floor(Math.random() * (mode === 'basic' ? 10 : 20)) + 1);
      }
      
      // Add brackets/exponents occasionally in advanced
      if (mode === 'advanced' && Math.random() > 0.7) {
        const parenStart = Math.floor(Math.random() * (expr.length / 2)) * 2;
        expr.splice(parenStart, 0, ')');
        expr.splice(parenStart, 0, '(');
      }
      
      currentProblem = expr;
      currentSteps = [];
      stepIndex = 0;
      updateDisplay();
      document.getElementById('answerInput').disabled = true;
      document.getElementById('stepBtn').disabled = false;
      document.getElementById('feedback').innerHTML = '';
    };

    const updateDisplay = () => {
      const problemDiv = document.getElementById('problem');
      problemDiv.innerHTML = '';
      currentSteps[stepIndex]?.steps.forEach((part, i) => {
        const span = document.createElement('span');
        span.textContent = part;
        span.className = `step ${i <= currentSteps[stepIndex]?.current ? 'active' : ''}`;
        problemDiv.appendChild(span);
      });
    };

    const stepForward = () => {
      if (stepIndex < currentSteps.length - 1) {
        stepIndex++;
        updateDisplay();
        if (stepIndex === currentSteps.length - 1) {
          correctAnswer = currentSteps[stepIndex].value;
          document.getElementById('answerInput').disabled = false;
          document.getElementById('answerInput').focus();
          document.getElementById('stepBtn').textContent = 'Reset';
          document.getElementById('stepBtn').onclick = () => { stepIndex = 0; updateDisplay(); };
        }
      }
    };

    const checkAnswer = () => {
      const userAnswer = parseFloat(document.getElementById('answerInput').value);
      const fb = document.getElementById('feedback');
      if (Math.abs(userAnswer - correctAnswer) < 0.01) {
        fb.textContent = 'Correct! 🎉';
        fb.className = 'feedback correct';
        score++;
        updateScore();
      } else {
        fb.textContent = `Nope. It's ${correctAnswer}`;
        fb.className = 'feedback wrong';
      }
    };

    const computeSteps = (expr) => {
      // Simplified evaluator that generates visual steps (not full parser for brevity)
      // In production, use a proper expression parser like math.js
      let steps = [];
      let display = expr.map(x => x.toString()).join(' ');
      
      // Simulate PEMDAS steps with highlights
      steps.push({ steps: display.split(' ').map(s => s), current: 0, value: parseFloat(expr[0]) });
      
      // Placeholder for multi-step logic - expand for real parsing
      // For demo: simple left-to-right with precedence simulation
      let val = eval(expr.map(x => typeof x === 'string' && x !== '(' && x !== ')' ? x : x).join(' ')); // Safe eval for demo
      steps.push({ steps: [`= ${val}`], current: 1, value: val });
      
      return steps;
    };

    const nextProblem = () => {
      generateProblem();
      currentSteps = computeSteps(currentProblem);
    };

    const updateScore = () => {
      document.getElementById('score').textContent = `Score: ${score}`;
    };

    const toggleMenu = () => {
      document.getElementById('menu').classList.toggle('show');
      document.getElementById('hints').innerHTML = [
        'Work inside brackets first.',
        'Exponents before ×÷.',
        'Left to right for same level.',
        `Basic: No ^ or √. Advanced: All ops + brackets.`
      ].map(h => `<li>${h}</li>`).join('');
    };

    // Event listeners
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelector('.mode-btn.active').classList.remove('active');
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        nextProblem();
      };
    });

    // Init
    generateProblem();
    updateScore();
  </script>
</body>
</html>
